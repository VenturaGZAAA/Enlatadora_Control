; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32@8.0.0
monitor_speed = 115200
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = post:post_upload.py
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11 -std=gnu++14 -std=c++11 -std=c++14
build_flags = -std=gnu++17
              -DENABLE_USE_ASYNC_WEBSOCKET_SERVER
              -D ARDUINO_USB_MODE=1
              -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    symlink://lib/EspManagers/Monitor
    symlink://lib/EspManagers/SerialManager
    symlink://lib/EspManagers/WifiManager
    symlink://lib/EspManagers/WebServerManager
    symlink://lib/EspManagers/EvenTheRGBLedHasManagers
    symlink://lib/EspManagers/UsbHIDManager
    symlink://lib/EspManagers/EspEvent